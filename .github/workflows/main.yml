 name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main  # غيّرها لو فرعك الرئيسي اسمه مختلف

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ نسخ ملفات الريبو
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # أو النسخة اللي مشروعك شغال عليها

      # 3️⃣ تثبيت الـ dependencies من المسار الصحيح
      - name: Install dependencies
        run: npm install
        working-directory: ./p  # هنا المسار اللي فيه package.json

      # 4️⃣ بناء المشروع من نفس المسار
      - name: Build project
        run: npm run build
        working-directory: ./p

      # 5️⃣ رفع build على GitHub Pages
      - name: Deploy to GitHub Pages
        run: npx gh-pages -d build
        working-directory: ./p
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

