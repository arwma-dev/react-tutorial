name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main   # غيّرها للفرع الرئيسي عندك إذا اسمه مختلف

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ استدعاء الكود
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ تجهيز Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # أو النسخة اللي مشروعك بيشتغل عليها

      # 3️⃣ تثبيت الحزم
      - name: Install dependencies
        run: npm install
        # working-directory: ./  -> مش محتاج لو المشروع في الجذر

      # 4️⃣ بناء المشروع
      - name: Build project
        run: npm run build

      # 5️⃣ رفعه على GitHub Pages
      - name: Deploy to GitHub Pages
        run: npx gh-pages -d build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


